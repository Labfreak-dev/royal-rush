<body>
<canvas id="game" tabindex="0"></canvas>
<script>
/* Art: original art made for this project (v3 tiki/jungle pack, trimmed + embedded by tools/build_assets.py).
   Audio: original music and sound effects made for this project (music created with ElevenLabs), embedded by tools/build_audio.py.
   Fonts: Luckiest Guy (Apache 2.0), Lilita One (SIL OFL 1.1). */
/*__ASSETS__*/
</script>
<script>
(function(){
'use strict';
// ---------- constants ----------
const W=1280,H=720;
const COLS=5,ROWS=12,TS=56,CW=TS,CH=TS;
const BX=500,BY=24,BW=COLS*CW,BH=ROWS*CH;   // tile area 500..780 x 24..696, centred on x=640
const RANKS=['10','J','Q','K','A'];
const SUITS=['S','H','D','C'];
// timings (artist spec, 30 fps frames)
const F=1/30;
const FLASH=6*F, POP=F, REMOVE_AFTER=4*F, HOVER=6*F, FALL_STEP=TS/840, SWAP_T=0.08, SMEAR_T=SWAP_T+0.06;
const LAND_T=0.16;
const SHAKE_T=9*F, BANNER_T=1.7, GRACE=2.0, RAISE_SPEED=7, INTRO=1.6;
const FLOOR={floor:true};
const FONT_BIG='"Luckiest","Trebuchet MS",Arial,sans-serif';
const FONT_UI='"Lilita","Trebuchet MS",Arial,sans-serif';
// HUD layout (1280x720)
const L={logo:{x:30,y:10,w:172},group:{x:106,y:352},score:{x:40,y:604,w:262,h:92},mult:{x:312,y:604,w:112,h:92},
  speed:{x:846,y:30,w:330,h:70},lvl:{x:1186,y:30,w:64,h:70},meter:{x:846,y:560,w:404,h:36},bombs:{x:846,y:604,w:404,h:92},banner:{x:640,y:250},gear:{x:216,y:22,s:46},chainAt:[640,250]};

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let DPR=1,HI=false;
function resize(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=Math.floor(W*s)+'px';canvas.style.height=Math.floor(H*s)+'px';
  DPR=Math.max(1,Math.min(2.5,(window.devicePixelRatio||1)*s));
  HI=DPR>=1.25;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
}

// ---------- assets ----------
const IMG={};const META=ASSETS.meta;let assetsReady=false;
function b64ToBuf(uri){const b=atob(uri.slice(uri.indexOf(',')+1));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}
function loadAssets(){
  const jobs=Object.keys(ASSETS.images).map(n=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.onerror=()=>res();im.src=ASSETS.images[n];IMG[n]=im;}));
  if(window.FontFace&&document.fonts){for(const n of Object.keys(ASSETS.fonts)){try{const f=new FontFace(n,b64ToBuf(ASSETS.fonts[n]));jobs.push(f.load().then(ff=>{document.fonts.add(ff);}).catch(()=>{}));}catch(e){}}}
  return Promise.all(jobs).then(()=>{assetsReady=true;});
}

// ---------- helpers ----------
const rnd=n=>Math.floor(Math.random()*n);
const rr_=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const snap=v=>Math.round(v*DPR)/DPR;
const easeOutQuad=p=>1-(1-p)*(1-p);
function easeOutBack(p){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function img(n){const i=IMG[n];return i&&i.complete&&i.naturalWidth?i:null;}
function drawImg(n,x,y,w,h){const i=img(n);if(!i)return;ctx.drawImage(i,snap(x),snap(y),w==null?i.naturalWidth:w,h==null?i.naturalHeight:h);}
function drawLayer(n){const m=META[n];drawImg(n,m.x,m.y);}
function nine(n,x,y,w,h,b,db){const i=img(n);if(!i)return;const sw=i.naturalWidth,sh=i.naturalHeight;db=db||b;x=snap(x);y=snap(y);
  const sx=[0,b,sw-b,sw],sy=[0,b,sh-b,sh],dx=[x,x+db,x+w-db,x+w],dy=[y,y+db,y+h-db,y+h];
  for(let a=0;a<3;a++)for(let c=0;c<3;c++){const w0=dx[c+1]-dx[c],h0=dy[a+1]-dy[a];if(w0>0&&h0>0)ctx.drawImage(i,sx[c],sy[a],sx[c+1]-sx[c],sy[a+1]-sy[a],dx[c],dy[a],w0,h0);}}
function drawTile(name,x,y,alpha){
  const key=HI?'tiles84':'tiles56';const im=img(key);const m=META[key];const f=m.frames[name];if(!im||!f)return;
  if(alpha!=null&&alpha<1){ctx.save();ctx.globalAlpha*=alpha;ctx.drawImage(im,f[0],f[1],m.size,m.size,snap(x),snap(y),TS,TS);ctx.restore();}
  else ctx.drawImage(im,f[0],f[1],m.size,m.size,snap(x),snap(y),TS,TS);
}
// sprite sheet frame, anchored: (px,py) is where the sheet's anchor lands
function drawSheet(n,i,px,py,s,alpha,blend){const im=img(n),m=META[n];if(!im||!m)return;i=clamp(i|0,0,m.n-1);s=s||1;
  const sx=(i%m.cols)*(m.w+2)+1,sy=Math.floor(i/m.cols)*(m.h+2)+1;
  const needS=(alpha!=null&&alpha<1)||blend;if(needS){ctx.save();if(alpha!=null)ctx.globalAlpha*=alpha;if(blend)ctx.globalCompositeOperation=blend;}
  ctx.drawImage(im,sx,sy,m.w,m.h,px-m.ax*s,py-m.ay*s,m.w*s,m.h*s);
  if(needS)ctx.restore();}
// bitmap score font (white, baked black shadow): glyph at (penX-origin_x, centreY-lh/2)
function textW(px,str){const m=META['font'+px];let w=0;for(const ch of str){const g=m.g[ch];if(g)w+=g[4];}return w;}
function drawText(px,str,x,cy,align,scale,alpha){
  const m=META['font'+px],im=img('font'+px);if(!im)return 0;scale=scale||1;
  const w=textW(px,str);ctx.save();if(alpha!=null)ctx.globalAlpha*=alpha;ctx.translate(x,cy);ctx.scale(scale,scale);
  let pen=align==='right'?-w:align==='center'?-w/2:0;
  for(const ch of str){const g=m.g[ch];if(!g)continue;ctx.drawImage(im,g[0],g[1],g[2],g[3],pen-g[5],-m.lh/2,g[2],g[3]);pen+=g[4];}
  ctx.restore();return w*scale;}
function label(t,x,y,size,col,align,font){ctx.font=size+'px '+(font||FONT_UI);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff4dc';ctx.fillText(t,x,y);}
function shadowLabel(t,x,y,size,col,align,font){ctx.save();ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;label(t,x,y,size,col,align,font);const w=ctx.measureText(t).width;ctx.restore();return w;}
function goldGrad(y,h){const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#fffbd0');g.addColorStop(0.45,'#ffd84a');g.addColorStop(1,'#ff8a10');return g;}
function bigText(t,x,y,size,fill,stroke,lw,maxW){ctx.font=size+'px '+FONT_BIG;if(maxW){const w=ctx.measureText(t).width;if(w>maxW){size=Math.floor(size*maxW/w);ctx.font=size+'px '+FONT_BIG;}}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=lw||Math.max(4,size/6);ctx.strokeStyle=stroke||'#3a1a00';ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);}
// code-drawn banner in the style of the gold banners (used where the pack has no banner, e.g. FIVE OF A KIND)
const madeBanners={};
function makeBanner(text,size){
  const key=text+'|'+size;if(madeBanners[key])return madeBanners[key];
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=size+'px '+FONT_BIG;
  const w=Math.ceil(x.measureText(text).width)+size*0.9,h=Math.ceil(size*1.7);c.width=w*2;c.height=h*2;
  x.scale(2,2);x.font=size+'px '+FONT_BIG;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  const cx=w/2,cy=h/2+size*0.06;
  x.save();x.shadowColor='rgba(255,170,40,0.75)';x.shadowBlur=size*0.35;x.fillStyle='#ffb530';x.fillText(text,cx,cy);x.restore();
  for(let d=size*0.12;d>0;d-=1){x.fillStyle='#6a2c00';x.fillText(text,cx,cy+d);}           // extrusion
  x.lineWidth=size*0.14;x.strokeStyle='#4a1c00';x.strokeText(text,cx,cy);
  const g=x.createLinearGradient(0,cy-size/2,0,cy+size/2);g.addColorStop(0,'#fffbe0');g.addColorStop(0.45,'#ffe066');g.addColorStop(1,'#ff9a1a');
  x.fillStyle=g;x.fillText(text,cx,cy);
  c.dw=w;c.dh=h;madeBanners[key]=c;return c;}
// ---------- audio ----------
// Sampled audio pack (Ogg Vorbis, embedded) played through Web Audio. Music loops use AudioBufferSourceNode.loop
// (sample-exact, gapless). If a sound can't be decoded (e.g. Safari < 17 has no Vorbis), SFX fall back to the
// procedural tones below and the music stays silent; nothing throws.
let AC=null,muted=false,MASTER=null,MUSIC_BUS=null,MUSIC_GAIN=null,SFX_BUS=null,audioInit=false;
// ---- settings (saved in localStorage 'royalRush.settings'): SFX / music volume 0-100 in steps of 10, reduce flashing ----
const SETTINGS_KEY='royalRush.settings';
const SET={sfx:100,music:100,reduceFlash:false};
function loadSettings(){try{const o=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');if(o&&typeof o==='object'){
  for(const k of ['sfx','music'])if(typeof o[k]==='number'&&isFinite(o[k]))SET[k]=clamp(Math.round(o[k]/10)*10,0,100);
  if(typeof o.reduceFlash==='boolean')SET.reduceFlash=o.reduceFlash;}}catch(e){}}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(SET));}catch(e){}}
loadSettings();
function applyVolumes(){if(!audioInit||!AC)return;const t=AC.currentTime;
  for(const [g,v] of [[SFX_BUS,SET.sfx/100],[MUSIC_GAIN,SET.music/100]]){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(v,t);}}
const BUF={},DECODE_ERR=[],AUD_LOG=[],AUD_LAST={},VOICES=[],VOICE_CAP=6;let decodePending=0,decodeDone=false;
const MUSIC_VOL={game_loop:0.55,menu_loop:0.5,danger_loop:0.55};
const XFADE=0.5;
const MUS={want:null,tracks:{},duck:1,duckUntil:0,offsets:{}};
function ensureAudio(){try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();}
  if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});
  if(!audioInit){audioInit=true;
    MASTER=AC.createGain();MASTER.gain.value=muted?0:1;MASTER.connect(AC.destination);
    MUSIC_GAIN=AC.createGain();MUSIC_GAIN.gain.value=SET.music/100;MUSIC_GAIN.connect(MASTER);
    MUSIC_BUS=AC.createGain();MUSIC_BUS.connect(MUSIC_GAIN);SFX_BUS=AC.createGain();SFX_BUS.gain.value=SET.sfx/100;SFX_BUS.connect(MASTER);
    const names=Object.keys(ASSETS.audio||{});decodePending=names.length;
    // music first so it is ready soonest
    names.sort((a,b)=>(ASSETS.audioMeta[b].kind==='music')-(ASSETS.audioMeta[a].kind==='music'));
    for(const n of names){let p;
      const ok=b=>{BUF[n]=b;},bad=e=>{DECODE_ERR.push(n);},fin=()=>{if(--decodePending<=0)decodeDone=true;};
      try{p=AC.decodeAudioData(b64ToBuf(ASSETS.audio[n]),ok,bad);if(p&&p.then)p.then(()=>{},()=>{}).then(fin);else setTimeout(fin,0);}
      catch(e){bad(e);fin();}}
  }}catch(e){AC=null;}}
function audioOn(){return !!(AC&&audioInit&&AC.state==='running');}
function setMuted(m){muted=m;if(MASTER){MASTER.gain.cancelScheduledValues(AC.currentTime);MASTER.gain.setTargetAtTime(m?0:1,AC.currentTime,0.02);}}
// play a decoded SFX; returns false if unavailable (caller may fall back to a tone)
function playSfx(n,vol,rate,throttle){
  if(!BUF[n])return false;if(!audioOn())return true;
  const now=AC.currentTime;if(throttle&&AUD_LAST[n]!=null&&now-AUD_LAST[n]<throttle)return true;AUD_LAST[n]=now;
  try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=BUF[n];if(rate)s.playbackRate.value=rate;g.gain.value=vol;s.connect(g);g.connect(SFX_BUS);
    // every play is its own source node, so hand stings and combos overlap; cap them at VOICE_CAP by fading out the oldest
    if(/^(hand_|combo_)/.test(n)){if(VOICES.length>=VOICE_CAP){const o=VOICES.shift();try{o.g.gain.setTargetAtTime(0,now,0.03);o.s.stop(now+0.15);}catch(e){}}
      const v={s,g};VOICES.push(v);s.onended=()=>{const i=VOICES.indexOf(v);if(i>=0)VOICES.splice(i,1);};}
    s.start();AUD_LOG.push(n);if(AUD_LOG.length>60)AUD_LOG.shift();}catch(e){}
  return true;}
function tone(f,d,type,vol,slide,delay){if(!audioOn())return;const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||0.08,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(SFX_BUS);o.start(t0);o.stop(t0+d+0.03);}
// ---- music: one wanted track at a time, 0.5 s crossfades; game_loop resumes where it left off after danger ----
function musicStart(n){const b=BUF[n];if(!b)return null;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;s.loop=true;s.loopStart=0;s.loopEnd=b.duration;
  g.gain.value=0;s.connect(g);g.connect(MUSIC_BUS);const off=(MUS.offsets[n]||0)%b.duration;s.start(AC.currentTime,off);
  const t={n,src:s,gain:g,t0:AC.currentTime-off,level:0};g.gain.setTargetAtTime(MUSIC_VOL[n],AC.currentTime,XFADE/4);t.level=MUSIC_VOL[n];return t;}
function musicStop(t,fade){const now=AC.currentTime;if(t.n==='game_loop')MUS.offsets[t.n]=(now-t.t0)%t.src.buffer.duration;
  t.gain.gain.cancelScheduledValues(now);t.gain.gain.setValueAtTime(t.gain.gain.value,now);t.gain.gain.linearRampToValueAtTime(0,now+fade);try{t.src.stop(now+fade+0.05);}catch(e){}t.level=0;}
function musicWanted(){if(app==='title')return 'menu_loop';if(!S)return null;
  if(app==='gameover')return null;return S.inDanger?'danger_loop':'game_loop';}
function musicTick(){
  if(!audioOn())return;
  const w=musicWanted();
  if(w!==MUS.want){const prev=MUS.want;MUS.want=w;
    for(const k of Object.keys(MUS.tracks)){musicStop(MUS.tracks[k],app==='gameover'?0.4:XFADE);delete MUS.tracks[k];}
    if(w==='menu_loop'||prev==='menu_loop'||prev===null)MUS.offsets.game_loop=0;
    MUS.pendingStart=w;}
  if(MUS.pendingStart&&BUF[MUS.pendingStart]){const t=musicStart(MUS.pendingStart);if(t)MUS.tracks[t.n]=t;MUS.pendingStart=null;}
  // pause ducks the music to 25 %, a royal flush ducks it by 6 dB for 2.5 s
  const duck=(app==='paused'?0.25:1)*(AC.currentTime<MUS.duckUntil?0.5:1);
  if(duck!==MUS.duck){MUS.duck=duck;MUSIC_BUS.gain.setTargetAtTime(duck,AC.currentTime,0.08);}
}
let gameOverSfxAt=0;
const HAND_SFX={kind3:['hand_three_kind',0.6],flush:['hand_flush',0.65],straight:['hand_straight',0.6],fullhouse:['hand_full_house',0.7],kind4:['hand_four_kind',0.75],royal:['hand_royal_flush',0.85]};
const sfx={
  move(){if(!playSfx('ui_click',0.22,1,0.04))tone(660,0.03,'square',0.02);},
  swap(){if(!playSfx('card_swap',0.45))tone(420,0.05,'triangle',0.06,1.6);},
  // best hand of the clear (by value); five of a kind = four-of-a-kind sting pitched up 2 semitones
  hand(best,chain){const m=HAND_SFX[best.fam]||HAND_SFX.kind3;const five=best.fam==='kind4'&&best.n>=5;
    if(best.fam==='royal'&&audioOn())MUS.duckUntil=AC.currentTime+2.5;
    if(!playSfx(m[0],m[1],five?1.122:1)){const b=440*Math.pow(1.122,Math.min(chain,12)-1);tone(b,0.18,'triangle',0.09);tone(b*1.25,0.18,'triangle',0.07,0,0.06);tone(b*1.5,0.25,'triangle',0.07,0,0.12);}},
  pop(i){if(!BUF.hand_three_kind)tone(700+i*60,0.06,'sine',0.05,1.5);},   // procedural fallback only
  chain(n){const st=n-1;const name=st<=1?'combo_1':st===2?'combo_2':'combo_3';const vol=st<=1?0.55:st===2?0.58:0.6;
    if(!playSfx(name,vol,st>3?Math.min(1.5,Math.pow(1.0595,2*(st-3))):1))for(let i=0;i<3;i++)tone(520*Math.pow(1.19,n+i),0.16,'square',0.035,0,i*0.07);},
  bomb(){if(!playSfx('card_land',0.8,0.55))tone(160,0.35,'sawtooth',0.1,0.2);},
  land(){if(!playSfx('card_land',0.4,1,0.06))tone(120,0.05,'sine',0.035);},
  rise(){playSfx('row_rise',0.3,1,0.12);},
  level(){if(!playSfx('level_up',0.65))tone(523,0.1,'square',0.04),tone(784,0.15,'square',0.04,0,0.1);},
  over(){gameOverSfxAt=AC?AC.currentTime:0;
    if(BUF.game_over){if(audioOn()){const d=AC.currentTime+0.35;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=BUF.game_over;g.gain.value=0.7;s.connect(g);g.connect(SFX_BUS);s.start(d);AUD_LOG.push('game_over');}}
    else{tone(392,0.3,'triangle',0.08,0.5);tone(262,0.5,'triangle',0.08,0.5,0.25);}},
  challenge(){if(!playSfx('hand_pair',0.5))tone(880,0.1,'square',0.04),tone(1175,0.2,'square',0.04,0,0.1);},
  challengeDone(){if(!playSfx('level_up',0.65))tone(880,0.1,'square',0.04),tone(1175,0.2,'square',0.04,0,0.1);},
  warn(){if(!playSfx('danger_warning',0.35,1,2.0))tone(220,0.08,'square',0.03);},
  ready(){if(!playSfx('ui_confirm',0.5))tone(392,0.12,'square',0.05);},
  go(){if(!BUF.ui_confirm)tone(784,0.25,'square',0.06);},
  click(){if(!playSfx('ui_click',0.4))tone(660,0.03,'square',0.02);},
  confirm(){if(!playSfx('ui_confirm',0.5))tone(784,0.12,'square',0.04);},
  preview(){if(!playSfx('card_swap',0.45))tone(420,0.05,'triangle',0.06,1.6);}
};
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{if(document.hidden)AC.suspend().catch(()=>{});else AC.resume().catch(()=>{});}catch(e){}});

// ---------- hand detection ----------
const HAND_DEF={
  kind:n=>({key:'kind'+n,fam:n>=4?'kind4':'kind3',n,name:n===3?'THREE OF A KIND':n===4?'FOUR OF A KIND':n===5?'FIVE OF A KIND':n+' OF A KIND',value:n===3?30:n===4?100:250+(n-5)*150,banner:n===3?'three_of_a_kind':n===4?'four_of_a_kind':null}),
  flush:n=>({key:'flush'+n,fam:'flush',n,name:n===4?'FLUSH':n+'-CARD FLUSH',value:n===4?60:120+(n-5)*80,banner:'flush'}),
  straight:()=>({key:'straight',fam:'straight',n:5,name:'STRAIGHT',value:150,banner:'straight'}),
  full:()=>({key:'fullhouse',fam:'fullhouse',n:5,name:'FULL HOUSE',value:200,banner:'full_house'}),
  royal:()=>({key:'royal',fam:'royal',n:5,name:'ROYAL FLUSH',value:1000,banner:'royal_flush'})
};
function evalSeg(seg,lineId,out){
  const n=seg.length;
  const push=(def,a,b)=>{out.push(Object.assign({line:lineId,cells:seg.slice(a,b).map(x=>({r:x.r,c:x.c}))},def));};
  for(let i=0;i<n;){let j=i;while(j+1<n&&seg[j+1].k.r===seg[i].k.r)j++;if(j-i+1>=3)push(HAND_DEF.kind(j-i+1),i,j+1);i=j+1;}
  for(let i=0;i<n;){let j=i;while(j+1<n&&seg[j+1].k.s===seg[i].k.s)j++;if(j-i+1>=4)push(HAND_DEF.flush(j-i+1),i,j+1);i=j+1;}
  for(let i=0;i+5<=n;i++){
    const cnt=[0,0,0,0,0];let same=true;
    for(let q=i;q<i+5;q++){cnt[seg[q].k.r]++;if(seg[q].k.s!==seg[i].k.s)same=false;}
    const srt=cnt.slice().sort((a,b)=>b-a);
    if(srt[0]===1){push(same?HAND_DEF.royal():HAND_DEF.straight(),i,i+5);}
    else if(srt[0]===3&&srt[1]===2){push(HAND_DEF.full(),i,i+5);}
  }

function findHands(g,elig){
  const hands=[];
  const scan=(cells,id)=>{let seg=[];const fl=()=>{if(seg.length>=3)evalSeg(seg,id,hands);seg=[];};
    for(const [r,c] of cells){const k=g[r][c];if(k&&elig(k))seg.push({r,c,k});else fl();}fl();};
  for(let r=0;r<g.length;r++){const L=[];for(let c=0;c<COLS;c++)L.push([r,c]);scan(L,'h'+r);}
  for(let c=0;c<COLS;c++){const L=[];for(let r=0;r<g.length;r++)L.push([r,c]);scan(L,'v'+c);}
  hands.sort((a,b)=>b.value-a.value||b.cells.length-a.cells.length);
  const acc=[];
  for(const h of hands){
    const u=new Set();for(const a of acc)if(a.line===h.line)for(const x of a.cells)u.add(x.r*COLS+x.c);
    if(h.cells.every(x=>u.has(x.r*COLS+x.c)))continue;
    acc.push(h);
  }
  return acc;
}

function loadBest(m){try{return parseInt(localStorage.getItem('royalRush.best.'+m)||'0',10)||0;}catch(e){return 0;}}

function newCard(){return {r:rnd(5),s:rnd(4),st:'idle',t:0,chain:false,swapT:0,swapFrom:0,smearT:0,offY:0,id:++cardId};}
function emptyGrid(){const g=[];for(let r=0;r<ROWS;r++){g.push(new Array(COLS).fill(null));}return g;}
const allElig=()=>true;
const cardName=k=>RANKS[k.r]+SUITS[k.s];

// The incoming row is generated once, before it is ever shown, and is then immutable until it enters.
// v7 anti-auto-match: it is generated when the previous row finishes arriving, against the board it will
// land under. The board is first "settled" (clearing cards removed, falling cards dropped, and any hands that
// would still resolve on their own cleared, repeated until stable), then the row is built cell by cell with
// backtracking over the 20 rank/suit choices in random order, so that it forms no hand within itself
// and no column hand with the cards that will sit above it. Only a player move made after the row appears
// (a swap, a bomb, or a clear that changes the bottom of the board) can still make it match on arrival; among the
// allowed cards, ones that stay safe after any single sideways move in the 4 cards above are tried first.
function settledCols(g){
  let cols=[];for(let c=0;c<COLS;c++){const col=[];for(let r=ROWS-1;r>=0;r--){const k=g[r][c];if(k&&k.st!=='clear')col.push({r:k.r,s:k.s});}cols.push(col);}
  for(let it=0;it<24;it++){const h=Math.max(ROWS,...cols.map(x=>x.length)),gg=[];
    for(let r=0;r<h;r++){const row=[];for(let c=0;c<COLS;c++)row.push(cols[c][h-1-r]||null);gg.push(row);}
    const hs=findHands(gg,allElig);if(!hs.length)break;
    const dead=new Set();for(const x of hs)for(const q of x.cells)dead.add(q.r*COLS+q.c);
    cols=cols.map((col,c)=>col.filter((k,i)=>!dead.has((h-1-i)*COLS+c)));}
  return cols;}   // per column, bottom -> top
// hands (value) that card k would make at the bottom of column col (bottom -> top), and within row prefix pre
function colHands(col,k){const seg=[];for(let i=col.length-1;i>=0;i--)seg.push({r:col.length-1-i,c:0,k:col[i]});seg.push({r:col.length,c:0,k});
  if(seg.length<3)return 0;const out=[];evalSeg(seg,'v',out);let v=0;for(const h of out)if(h.cells.some(x=>x.r===col.length))v+=h.value;return v;}
function rowHands(pre){if(pre.length<3)return 0;const out=[];evalSeg(pre.map((k,c)=>({r:0,c,k})),'h',out);let v=0;for(const h of out)if(h.cells.some(x=>x.c===pre.length-1))v+=h.value;return v;}
// how many single sideways moves in the 4 cards just above cell c would make card k match there
function colRisk(cols,c,k){const col=cols[c];let n=0;
  for(let i=0;i<4&&i<col.length;i++)for(const nc of [c-1,c+1]){if(nc<0||nc>=COLS)continue;const o=cols[nc][i];
    const alt=o?col.slice(0,i).concat([o],col.slice(i+1)):col.slice(0,i).concat(col.slice(i+1));
    if(colHands(alt,k))n++;}
  return n;}
let ROWGEN={rows:0,fallback:0,nodes:0};
function genRow(g){
  g=g||(S&&S.grid)||emptyGrid();const cols=settledCols(g);
  const opts=[];for(let r=0;r<5;r++)for(let q=0;q<4;q++)opts.push({r,s:q});
  const pick=[];let nodes=0;
  const dfs=c=>{if(c===COLS)return true;let o=opts.slice();for(let i=o.length-1;i>0;i--){const j=rnd(i+1);[o[i],o[j]]=[o[j],o[i]];}
    o=o.map(k=>({k,w:colRisk(cols,c,k)})).sort((a,b)=>a.w-b.w).map(x=>x.k);   // stable: random within equal risk
    for(const k of o){if(++nodes>4000)return false;if(colHands(cols[c],k))continue;pick[c]=k;if(rowHands(pick.slice(0,c+1)))continue;if(dfs(c+1))return true;}
    return false;};
  let ok=dfs(0);ROWGEN.rows++;ROWGEN.nodes+=nodes;
  if(!ok){   // practically impossible (columns rule out at most 3 ranks and 1 suit): least-matching of 200 random rows
    ROWGEN.fallback++;let best=null,bv=1e9;
    for(let t=0;t<200;t++){const row=[];let v=0;for(let c=0;c<COLS;c++){const k={r:rnd(5),s:rnd(4)};row.push(k);v+=colHands(cols[c],k);}
      v+=findHands([row.map(k=>Object.assign({},k))],allElig).reduce((a,h)=>a+h.value,0);if(v<bv){bv=v;best=row;}}
    pick.length=0;pick.push(...best);}
  return pick.map(k=>{const n=newCard();n.r=k.r;n.s=k.s;return n;});
}

function newGame(mode){

// ---------- actions ----------
function cardAt(r,c){return (r>=0&&r<ROWS&&c>=0&&c<COLS)?S.grid[r][c]:null;}
function trySwap(r,c1,c2){
  if(c2<0||c2>=COLS||c1<0||c1>=COLS||r<0||r>=ROWS)return false;
  const g=S.grid,a=g[r][c1],b=g[r][c2];
  if(!a&&!b)return false;
  const ok=k=>!k||k.st==='idle'||k.st==='hover';
  if(!ok(a)||!ok(b))return false;
  const fallingAbove=cc=>{if(r===0)return false;const u=g[r-1][cc];return !!(u&&u.st==='fall');};
  if(!a&&fallingAbove(c1))return false;
  if(!b&&fallingAbove(c2))return false;
  g[r][c1]=b;g[r][c2]=a;
  if(a){a.st='idle';a.swapT=SWAP_T;a.smearT=SMEAR_T;a.swapFrom=c1-c2;}
  if(b){b.st='idle';b.swapT=SWAP_T;b.smearT=SMEAR_T;b.swapFrom=c2-c1;}
  sfx.swap();
  return true;
}
function partnerCol(c){return c<COLS-1?c+1:c-1;}
function swapAtCursor(){const {r,c}=S.cursor;trySwap(r,c,partnerCol(c));}
function slide(dir){const {r,c}=S.cursor;if(trySwap(r,c,c+dir))S.cursor.c=c+dir;}
function useBomb(){
  const k=cardAt(S.cursor.r,S.cursor.c);
  if(!k||S.bombs<=0||!(k.st==='idle'||k.st==='hover'))return;
  S.bombs--;k.st='clear';k.bomb=true;k.t=0;k.popAt=0.3;k.endAt=0.3+REMOVE_AFTER;k.popped=false;k.chain=false;k.fxKey='gold';k.pillar=false;k.popA=1;k.pilA=0.8;S.sparkBudget=Math.max(S.sparkBudget,14);
  S.stop=Math.max(S.stop,3);
  sfx.bomb();
}

// gold banner: key = pack banner name, or {text} for a code-drawn one

// ---------- update ----------
function update(rdt){
  T+=rdt;frameNo++;
  if(app==='title'){return;}
  if(!S)return;
  // particles & fx run in real time
  for(const s of S.sparks){for(let k=0;k<2;k++){const h=rdt/2;s.vy+=SP.gravity_px_s2*FXS*h;const kk=Math.exp(-SP.drag_per_s*h);s.vx*=kk;s.vy*=kk;s.x+=s.vx*h;s.y+=s.vy*h;}s.age+=rdt;}
  S.sparks=S.sparks.filter(s=>s.age<s.life&&s.y<H+40);
  for(const c of S.chipsFx){c.vy+=700*rdt;c.y+=c.vy*rdt;c.fr+=c.fps*rdt;}
  S.chipsFx=S.chipsFx.filter(c=>c.y<c.yend+40);
  for(const f of S.fx){if(f.delay>0){f.delay-=rdt;continue;}f.t+=rdt;}
  S.fx=S.fx.filter(f=>f.delay>0||f.t<f.life);
  for(const p of S.popups){if(p.delay>0){p.delay-=rdt;continue;}p.t+=rdt;}
  S.popups=S.popups.filter(p=>p.t<p.life);
  for(const b of S.banners){if(b.delay>0){b.delay-=rdt;continue;}b.t+=rdt;}
  S.banners=S.banners.filter(b=>b.t<b.life||b.hold);
  if(S.shakeT>0){S.shakeT=Math.max(0,S.shakeT-rdt);if(!S.shakeT)S.shakeAmp=0;}
  S.lvlGlow=Math.max(0,S.lvlGlow-rdt);
  feelUpdate(rdt);
  if(S.clearAge>=0)S.clearAge+=rdt;
  if(S.wellFlash>=0)S.wellFlash+=rdt;
  if(app==='gameover'){S.overT+=rdt;return;}
  if(app!=='playing')return;

  const g=S.grid;
  // READY / GO intro: stack frozen, cursor and swaps allowed
  if(S.intro>0){S.intro-=rdt;if(S.goPending&&S.intro<=INTRO-0.9){S.goPending=false;banner('go',{y:300,life:0.75});sfx.go();}}

  S.slowing=keys.slow&&S.slowEnergy>0.01;
  if(S.slowing)S.slowEnergy=Math.max(0,S.slowEnergy-rdt*0.25);else S.slowEnergy=Math.min(1,S.slowEnergy+rdt*0.045);
  const dt=rdt*(S.slowing?0.4:1);
  for(const e of S.events)e.t-=dt;
  const due=S.events.filter(e=>e.t<=0);S.events=S.events.filter(e=>e.t>0);due.forEach(e=>e.fn());
  const live=S.intro<=0;
  if(live){
    S.elapsed+=dt;
    if(S.mode==='timed'){S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;gameOver('TIME UP');return;}}
    const lvl=Math.min(99,1+Math.floor(S.elapsed/(S.mode==='timed'?20:30)));
    if(lvl>S.level){S.level=lvl;S.lvlGlow=1.2;banner('level_up',{y:330});sfx.level();}
  }

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(!k)continue;if(k.swapT>0)k.swapT=Math.max(0,k.swapT-rdt);if(k.smearT>0)k.smearT=Math.max(0,k.smearT-rdt);if(k.offY<0)k.offY=Math.min(0,k.offY+dt/FALL_STEP);if(k.landT>0)k.landT=Math.max(0,k.landT-rdt);}

  // clearing: flash 0-167ms, then pop one tile per frame (starburst, sparks, pillar), then remove
  const removeList=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(!k||k.st!=='clear')continue;
    k.t+=dt;
    if(!k.popped&&k.t>=k.popAt){k.popped=true;const p=cellCenter(r,c);
      // v4: chain tiles get a lightning strike from the top of the screen, and the fireball one frame later
      const d=k.boltHit?F:0;if(k.boltHit)addFx('bolt',p.x,p.y,{alpha:0.9,blend:'lighter',board:true,sy:(p.y+10)/720});
      addFx((k.popIdx||0)%2?'smoke_b':'smoke_a',p.x,p.y,{board:true,delay:d+META.fireball.smokeAt*F});   // under the fireball, from its frame 3
      addFx('fireball',p.x,p.y,{alpha:k.bomb?1:k.fireA,blend:'lighter',board:true,delay:d});
      if(k.fxKey==='gold'&&!k.bomb){addFx('pop_gold',p.x,p.y,{alpha:k.popA,blend:'lighter',board:true});if(k.pillar)addFx('pillar_gold',p.x,p.y,{alpha:k.pilA,blend:'lighter',board:true});}
      spawnSparks(p.x,p.y,k.fxKey==='gold'?'gold':k.fxKey,k.bomb?14:0);
      if(k.bomb)shake(8);else sfx.pop(k.popIdx||0);}
    if(k.t>=k.endAt)removeList.push([r,c,k]);}
  for(const [r,c,k] of removeList){g[r][c]=null;if(!k.bomb)for(let q=r-1;q>=0;q--){const u=g[q][c];if(u&&u.st!=='clear')u.chain=true;}}

  // gravity (bottom-up): hang 6 frames, then fall at 14 px/frame (840 px/s) with a hard stop
  for(let c=0;c<COLS;c++)for(let r=ROWS-1;r>=0;r--){
    const k=g[r][c];if(!k||k.st==='clear')continue;
    const below=r===ROWS-1?FLOOR:g[r+1][c];
    const free=below===null;
    const moving=!!(below&&!below.floor&&(below.st==='hover'||below.st==='fall'));
    if(k.st==='idle'&&(free||moving)){k.st='hover';k.t=moving?(below.st==='hover'?below.t:0):HOVER;}
    else if(k.st==='hover'){
      if(!free&&!moving){k.st='idle';}
      else{k.t-=dt;if(k.t<=0){k.st='fall';k.fa=FALL_STEP;}}
    }
    if(k.st==='fall'){
      if(free){k.fa+=dt;if(k.fa>=FALL_STEP){k.fa-=FALL_STEP;g[r+1][c]=k;g[r][c]=null;k.offY=Math.max(-1,k.offY-1);}}
      else if(!moving){k.st='idle';k.offY=0;k.landF=frameNo;k.landT=LAND_T;
        if(below.floor||below.landF!==frameNo){const p=cellXY(r,c);addFx('puff_dust',p.x+CW/2,p.y+CH,{board:true});addFx('puff_light',p.x+CW/2,p.y+CH,{board:true,alpha:0.8,blend:'lighter'});sfx.land();}}
    }
  }

  // matching
  const hands=findHands(g,k=>k.st==='idle'&&k.swapT<=0);
  if(hands.length)resolveHands(hands);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(k&&k.chain&&k.st==='idle'&&k.swapT<=0)k.chain=false;}
  if(S.chain>0){let alive=false;for(let r=0;r<ROWS&&!alive;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(k&&(k.chain||k.st==='clear')){alive=true;break;}}
    if(!alive)S.chain=0;}

  // danger state (a card within 3 rows of the top)
  const danger=[0,1,2].some(r=>g[r].some(k=>k&&k.st!=='clear'));
  S.dangerCool=Math.max(0,S.dangerCool-rdt);
  if(danger&&!S.inDanger&&S.dangerCool<=0){banner('danger',{y:330,life:1.5});sfx.warn();}
  if(danger)S.dangerCool=2.5;
  S.inDanger=danger;

  // rise
  let anyClear=false;for(let r=0;r<ROWS&&!anyClear;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(k&&k.st==='clear'){anyClear=true;break;}}
  if(S.stop>0&&!anyClear)S.stop=Math.max(0,S.stop-dt);
  const busy=!live||anyClear||(S.stop>0&&!keys.raise);
  const topBusy=g[0].some(k=>k);
  if(!busy){
    if(topBusy){
      S.grace-=dt;
      if(T-S.lastWarn>0.35){S.lastWarn=T;sfx.warn();}
      if(S.grace<=0){gameOver('TOPPED OUT');return;}
    }else{
      S.grace=Math.min(GRACE,S.grace+dt*2);
      const sp=keys.raise?RAISE_SPEED:riseSpeed(S.level)*speedMul;
      S.rise+=sp*(keys.raise?rdt:dt);
      if(S.rise>=1)shiftUp();
    }
  }

  if(live){
    if(S.challenge){S.challenge.t-=dt;if(S.challenge.t<=0){textPopup('CHALLENGE MISSED',640,330,26,'#ffb0a0');S.challenge=null;S.nextChallenge=35;}}
    else{S.nextChallenge-=dt;if(S.nextChallenge<=0){const opts=[['flush','FLUSH'],['straight','STRAIGHT'],['fullhouse','FULL HOUSE'],['kind4','FOUR OF A KIND']];const o=opts[rnd(opts.length)];
      S.challenge={fam:o[0],name:o[1],t:25,max:25,bonus:400+S.level*100};banner('new_challenge',{y:300,life:1.8});textPopup(o[1]+'  ·  25s',640,362,26,'#fff4c0',{life:1.8});sfx.challenge();}}
  }
  while(S.score>=S.nextBombAt){S.nextBombAt+=3000;if(S.bombs<5){S.bombs++;textPopup('+1 BOMB',L.bombs.x+202,L.bombs.y-60,24,'#ffe07a');}}
}
function riseSpeed(l){return Math.min(2.2,0.1*Math.pow(1.13,l-1));}

function shiftUp(){
  S.shifts++;S.rise-=1;if(S.rise<0)S.rise=0;sfx.rise();
  for(let r=0;r<ROWS-1;r++)S.grid[r]=S.grid[r+1];
  S.grid[ROWS-1]=S.preview;          // exactly the row that was shown: no reroll at insertion
  S.preview=genRow(S.grid);           // the next row is generated now, against the board it will land under
  S.cursor.r=Math.max(0,S.cursor.r-1);
  if(S.sel)S.sel.r--; if(S.sel&&S.sel.r<0)S.sel=null;
  if(S.drag)S.drag.r--;
  // keep in-flight board fx attached to the stack
  for(const f of S.fx)if(f.board)f.y-=CH;
}

const PILLAR_FAMS={flush:1,fullhouse:1,kind4:1,royal:1};
function resolveHands(hands){
  const g=S.grid;const map=new Map();
  for(const h of hands)for(const x of h.cells)map.set(x.r*COLS+x.c,x);
  const cells=[...map.values()].sort((a,b)=>a.c-b.c||b.r-a.r);
  const chainHit=cells.some(x=>g[x.r][x.c].chain);
  if(chainHit)S.chain=Math.max(2,S.chain+1);else if(S.chain===0)S.chain=1;
  S.maxChain=Math.max(S.maxChain,S.chain);
  const n=cells.length;
  const royal=hands.some(h=>h.fam==='royal');
  const pillar=hands.some(h=>PILLAR_FAMS[h.fam]);
  const royalCells=new Set();hands.filter(h=>h.fam==='royal').forEach(h=>h.cells.forEach(x=>royalCells.add(x.r*COLS+x.c)));
  const endAt=FLASH+(n-1)*POP+REMOVE_AFTER;
  // v3 overlap rule: additive pops/pillars get weaker the more tiles clear together
  const popA=n<=2?1.0:n<=4?0.8:0.6,pilA=n<=2?0.8:n<=4?0.55:0.4;
  const fireA=[1,1,0.9,0.8,0.7][Math.min(n,5)]||0.65;   // v4 overlap rule: 1 -> 1.0 ... 5+ -> 0.65
  cells.forEach((x,i)=>{const k=g[x.r][x.c];k.boltHit=!!k.chain;k.st='clear';k.t=0;k.popAt=FLASH+i*POP;k.endAt=endAt;k.popped=false;k.chain=false;k.popIdx=i;
    k.fxKey=royalCells.has(x.r*COLS+x.c)?'gold':RANKS[k.r];k.pillar=pillar&&k.fxKey==='gold';k.popA=popA;k.pilA=pilA;k.fireA=n>=5?0.65:fireA;});
  S.sparkBudget=SPARK_CAP;
  let base=0;for(const h of hands)base+=h.value;
  const mult=Math.max(1,S.chain),shape=1+0.5*(hands.length-1),lf=1+(S.level-1)*0.1;
  const pts=Math.round(base*mult*shape*lf/5)*5;
  S.score+=pts;S.hands+=hands.length;S.cleared+=n;S.clearAge=0;
  // geometry of the group
  let cx=0,cy=0,top=1e9;for(const x of cells){const p=cellCenter(x.r,x.c);cx+=p.x;cy+=p.y;top=Math.min(top,p.y-CH/2);}cx/=n;cy/=n;
  const groups=[];for(const h of hands){let gp=groups.find(q=>q.name===h.name);if(!gp){gp={name:h.name,n:0,value:h.value,banner:h.banner,fam:h.fam,len:h.n,lines:[]};groups.push(gp);}gp.n++;gp.lines.push(h.line);}
  groups.sort((a,b)=>b.value-a.value);
  const g0=groups[0];
  const big=pillar||hands.some(h=>h.fam==='straight')||S.chain>=2||hands.length>1;
  const sh=Math.round(7*FXS);   // v3: 7 px at 64 px tiles -> 6 px at 56, decaying over 9 frames
  sfx.hand(hands.reduce((a,b)=>b.value>a.value?b:a),S.chain);
  const chN=S.chain;
  // t = 167ms: shake, banner, score popup, chip rain (the pops start now)
  later(FLASH,()=>{
    shake(sh);S.wellFlash=0;   // v3 well white flash: additive, alpha 0.40 then 0.14 (once per clear)
    const bo={tag:'hand_'+(g0.banner||'five_of_a_kind')};if(chainHit){bo.y=L.banner.y+98;bo.scale=0.72;}
    if(g0.banner)banner(g0.banner,bo);else banner('text:'+g0.name,bo);
    let yy=chainHit?L.banner.y+140:L.banner.y+72;
    if(g0.fam==='flush'&&g0.len>4){textPopup(g0.len+'-CARD FLUSH',640,yy-6,24,'#fff4c0',{life:BANNER_T});yy+=30;}
    if(groups[1]){const b1=groups[1];if(b1.banner)banner(b1.banner,{y:yy+10,scale:0.6,replace:false});else banner('text:'+b1.name,{y:yy+10,scale:0.6,replace:false});yy+=70;}
    if(hands.length>1){banner('combo',{y:yy+12,scale:0.62,replace:false});textPopup('x'+shape.toFixed(1)+' SHAPE BONUS',640,yy+50,18,'#ffe0ff',{life:BANNER_T});yy+=80;}
    if(chainHit){chainFx(cx,cy,chN);sfx.chain(chN);}
    S.popups.push({kind:'score',text:'+'+pts.toLocaleString('en-US'),x:cx,y:top-6,t:0,life:1.5,board:true});
    tossChips(cells.map(x=>cellCenter(x.r,x.c)),Math.min(18,3+n+(big?4:0)+3*Math.max(0,chN-1)+(royal?8:0)));
    if(royal)chipRain(30);
    punch(chainHit?0.028+0.006*Math.min(4,chN-2):big?0.016:0.009);
    if(chN>=3||royal||hands.length>1||g0.fam==='kind4')S.rays={t:0,life:0.6,x:cx,y:cy};
    // v3 optional beam for 5-card hands (gold for a royal flush, white otherwise), alpha 0.55, centred on the hand
    for(const h of hands){if(h.cells.length<5)continue;const hc=h.cells,p0=cellCenter(hc[0].r,hc[0].c),p1=cellCenter(hc[hc.length-1].r,hc[hc.length-1].c);
      addFx(h.fam==='royal'?'beam_gold':'beam_white',(p0.x+p1.x)/2,(p0.y+p1.y)/2,{alpha:0.55,blend:'lighter',board:true,rot:p0.x===p1.x?Math.PI/2:0});}
  });
  S.stop=Math.max(S.stop,0.9+0.45*(S.chain-1)+0.25*(hands.length-1));
  if(S.challenge){const ok=hands.some(h=>h.fam===S.challenge.fam||(S.challenge.fam==='flush'&&h.fam==='royal')||(S.challenge.fam==='straight'&&h.fam==='royal'));
    if(ok){const bonus=S.challenge.bonus;S.score+=bonus;S.challenge=null;S.nextChallenge=35;
      later(FLASH+1.0,()=>{banner('challenge_complete',{y:330,life:1.9});textPopup('+'+bonus.toLocaleString('en-US')+' BONUS',640,382,26,'#aef6ff',{life:1.9});chipRain(24);sfx.challengeDone();});}}
}

function gameOver(reason){
  app='gameover';S.overT=0;S.overReason=reason;S.banners=[];S.events=[];
  if(S.score>S.best){S.best=S.score;S.newBest=S.score>0;saveBest(S.mode,S.score);}

// ---------- input ----------
function onKey(e,down){
  const k=e.key,code=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(k))e.preventDefault();
  if(k==='Shift'||code==='KeyX'){keys.raise=down;}
  if(code==='KeyC'){keys.slow=down;}
  if(!down)return;
  ensureAudio();
  if(code==='KeyM'){setMuted(!muted);return;}
  if(!assetsReady)return;
  if(setOpen){settingsKey(e,k,code);return;}
  if(app==='title'){
    if(k==='ArrowUp'||k==='ArrowDown'){menuSel=(menuSel+(k==='ArrowUp'?2:1))%3;sfx.move();}
    else if(k==='Enter'||k===' '||code==='KeyZ'){if(menuSel===2){openSettings('title');sfx.click();}else newGame(menuSel===0?'action':'timed');}
    return;
  }
  if(app==='gameover'){
    if(S.overT<0.8)return;
    if(k==='Enter'||k===' '||code==='KeyZ')newGame(S.mode);
    else if(k==='Escape'){app='title';sfx.click();}
    return;
  }
  if(app==='paused'){
    if(k==='ArrowLeft'||k==='ArrowUp'){pauseSel=(pauseSel+2)%3;sfx.move();}
    else if(k==='ArrowRight'||k==='ArrowDown'){pauseSel=(pauseSel+1)%3;sfx.move();}
    else if(k==='Enter'||k===' '){if(!e.repeat)pauseAction(pauseSel);}
    else if(code==='KeyP'||k==='Escape'){app='playing';sfx.click();}else if(code==='KeyQ'){app='title';sfx.click();}
    return;}
  if(app!=='playing')return;
  // one space per action: swaps, A/D moves and bombs ignore key auto-repeat (arrow navigation may repeat)
  if(e.repeat&&(k===' '||code==='KeyZ'||code==='KeyB'||code==='KeyA'||code==='KeyD'))return;
  switch(true){
    case k==='ArrowLeft':moveCursor(0,-1);break;
    case k==='ArrowRight':moveCursor(0,1);break;
    case k==='ArrowUp':moveCursor(-1,0);break;
    case k==='ArrowDown':moveCursor(1,0);break;
    case k===' '||code==='KeyZ':swapAtCursor();break;
    case code==='KeyA':slide(-1);break;
    case code==='KeyD':slide(1);break;
    case code==='KeyB':useBomb();break;
    case code==='KeyP'||k==='Escape':app='paused';sfx.click();break;
  }
}
window.addEventListener('keydown',e=>onKey(e,true));
window.addEventListener('keyup',e=>onKey(e,false));
// autoplay rules: (re)start audio on any user gesture
for(const ev of ['click','touchend'])window.addEventListener(ev,()=>ensureAudio(),{passive:true});
window.addEventListener('blur',()=>{keys.raise=false;keys.slow=false;if(app==='playing')app='paused';});

function toGame(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function cellFromPt(p){if(!S)return null;p=unCam(p);const c=Math.floor((p.x-BX)/CW);const r=Math.floor((p.y-BY)/CH+S.rise);if(c<0||c>=COLS||r<0||r>=ROWS||p.y<BY||p.y>BY+BH)return null;return {r,c};}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();canvas.focus();const p=toGame(e);
  for(const b of buttons){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){e.preventDefault();
    if(b.drag){setDrag=b.drag;try{canvas.setPointerCapture(e.pointerId);}catch(_){}b.drag(p);return;}
    sfx.click();b.action();return;}}
  if(setOpen||app==='title')return;
  if(app==='gameover'){if(S.overT>0.8)newGame(S.mode);return;}
  if(app==='paused'){app='playing';return;}
  if(app!=='playing')return;
  const cell=cellFromPt(p);if(!cell)return;
  e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  if(S.sel&&S.sel.r===cell.r&&Math.abs(S.sel.c-cell.c)===1){trySwap(cell.r,S.sel.c,cell.c);S.cursor={r:cell.r,c:cell.c};S.sel=null;S.drag=null;return;}
  S.cursor={r:cell.r,c:cell.c};
  S.drag={r:cell.r,c:cell.c,x0:p.x,moved:false,done:false};
});
canvas.addEventListener('pointermove',e=>{
  if(setDrag){setDrag(toGame(e));return;}
  if(!S||app!=='playing'||!S.drag)return;
  // one drag = at most one swap with the neighbour, after crossing half a tile; the rest of the gesture is ignored
  if(S.drag.done)return;
  const p=toGame(e);const dx=p.x-S.drag.x0;
  if(Math.abs(dx)<CW/2)return;
  const d=dx>0?1:-1;S.drag.moved=true;S.sel=null;
  if(trySwap(S.drag.r,S.drag.c,S.drag.c+d)){S.drag.c+=d;S.drag.done=true;S.cursor={r:S.drag.r,c:S.drag.c};}
});
canvas.addEventListener('pointerup',()=>{
  if(setDrag){setDrag=null;return;}
  if(!S||!S.drag)return;
  if(!S.drag.moved){S.sel={r:S.drag.r,c:S.drag.c};}
  S.drag=null;
});

// ---------- v6 feel pass: lighting, camera, chain presentation (lightning + blue chrome numerals), chips to the table ----------
const easeOutCubic=p=>1-Math.pow(1-p,3);
function rrPath(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
// camera: slow idle drift (a few px, like a hand-held 3D camera) + a zoom punch on clears; zoom is about the well centre
const CAM={s:1,x:0,y:0};
function punch(a){if(!S||SET.reduceFlash)return;const prev=S.punchT<0.2?S.punchA*0.6:0;S.punchT=0;S.punchA=Math.max(a,prev);}
function camUpdate(){CAM.s=1;CAM.x=0;CAM.y=0;CAM.p=0;if(app==='title'||!S)return;
  const idle=app==='gameover'?0:1;
  CAM.x=idle*(1.6*Math.sin(T*0.31)+0.7*Math.sin(T*0.83));CAM.y=idle*(1.1*Math.sin(T*0.43+1));CAM.s=1+idle*0.0035*(0.5+0.5*Math.sin(T*0.27));
  if(!SET.reduceFlash&&S.punchT<0.45){const p=S.punchT/0.45;const k=p<0.12?easeOutQuad(p/0.12):1-easeOutCubic((p-0.12)/0.88);CAM.s+=S.punchA*k;CAM.p=+(S.punchA*k).toFixed(4);}}
function camT(){const s=CAM.s;ctx.setTransform(DPR*s,0,0,DPR*s,DPR*(640*(1-s)+CAM.x),DPR*(360*(1-s)+CAM.y));}
function unCam(p){const s=CAM.s;return {x:(p.x-(640*(1-s)+CAM.x))/s,y:(p.y-(360*(1-s)+CAM.y))/s};}
// screen fades between title and game
let fadeT=0,fadeLen=1,lastApp=null,titleT=0,wasReady=false;
function fadeIn(len){fadeT=len;fadeLen=len;}
function feelFrame(dt){
  if(assetsReady&&!wasReady){wasReady=true;fadeIn(0.35);}
  if(lastApp!==null&&app!==lastApp){if(app==='title'){fadeIn(0.3);titleT=0;}else if(lastApp==='title'||(lastApp==='gameover'&&app==='playing'))fadeIn(0.28);}
  lastApp=app;fadeT=Math.max(0,fadeT-dt);if(app==='title')titleT+=dt;
  for(const m of MOTES){m.y-=m.v*dt;m.x+=Math.sin(T*0.6+m.ph)*4*dt;if(m.y<-10){m.y=H+10;m.x=rr_(470,810);}}
  camUpdate();}
function feelUpdate(rdt){
  for(const c of S.chainTexts)c.t+=rdt;S.chainTexts=S.chainTexts.filter(c=>c.t<c.life);
  for(const c of S.toss){if(c.delay>0){c.delay-=rdt;continue;}c.t+=rdt;c.fr+=c.fps*rdt;}S.toss=S.toss.filter(c=>c.delay>0||c.t<c.life+0.45);
  if(S.rays){S.rays.t+=rdt;if(S.rays.t>=S.rays.life)S.rays=null;}
  S.punchT+=rdt;
  if(S.shownScore!==S.score){const d=S.score-S.shownScore;S.shownScore+=d*(1-Math.exp(-rdt*7));if(Math.abs(S.score-S.shownScore)<1)S.shownScore=S.score;S.scoreBump=0.2;}
  S.scoreBump=Math.max(0,S.scoreBump-rdt);

  S.multPop=Math.max(0,S.multPop-rdt);}
// chain link: the bitmap chrome "NX" at (640,250): easeOutBack 0.3->1 over 7 f, hold ~40 f breathing 4 %, then fade + rise 3 px/f over 10 f
// (the lightning is the bolt_v4 sheet, spawned per chain tile when it bursts)
const CH_IN=7*F,CH_HOLD=40*F,CH_OUT=10*F;
function chainFx(x,y,n){S.chainTexts=[{n,t:0,life:CH_IN+CH_HOLD+CH_OUT}];}
function drawDigits(str,cx,capY,s){const m=META.chain_digits,im=img('chain_digits');if(!im)return;let w=0;const gs=[...str].map(ch=>m.g[ch]).filter(Boolean);
  gs.forEach((g,i)=>{w+=g[4]+(i<gs.length-1?m.track:0);});
  ctx.save();ctx.translate(cx,capY);ctx.scale(s,s);let pen=-w/2;const base=m.cap/2;
  for(const g of gs){ctx.drawImage(im,g[0],g[1],g[2],g[3],pen-g[5],base-m.base,g[2],g[3]);pen+=g[4]+m.track;}ctx.restore();}
function drawChainTexts(){for(const c of S.chainTexts){const t=c.t;VIEW.chainTexts++;let s=1,a=1,dy=0;
  if(t<CH_IN)s=0.3+0.7*easeOutBack(t/CH_IN);else if(t<CH_IN+CH_HOLD)s=1+0.04*Math.sin((t-CH_IN)*6);
  else{const q=(t-CH_IN-CH_HOLD)/CH_OUT;a=1-q;dy=-3*(t-CH_IN-CH_HOLD)/F;s=1+0.04*Math.sin(CH_HOLD*6);}
  ctx.save();ctx.globalAlpha*=clamp(a,0,1);drawDigits(c.n+'X',L.chainAt[0],L.chainAt[1]+dy,s);ctx.restore();}}
// chips flung out of the well in arcs onto the chip table on the left, where they settle and join the stacks
function tossChips(from,n){for(let i=0;i<n;i++){const f=from[i%from.length];
  S.toss.push({x0:f.x,y0:f.y,x1:rr_(128,352),y1:rr_(420,492),h:rr_(110,230),t:0,life:rr_(0.55,0.85),delay:i*0.03,col:CHIP_COLS[rnd(7)],fr:rnd(12),fps:rr_(18,30),sc:rr_(0.42,0.6)});}}
function drawToss(){for(const c of S.toss){if(c.delay>0)continue;const p=Math.min(1,c.t/c.life);const x=c.x0+(c.x1-c.x0)*p,y=c.y0+(c.y1-c.y0)*p-c.h*4*p*(1-p);
  let a=1,yy=y;if(c.t>c.life){const q=(c.t-c.life)/0.45;yy=y-Math.abs(Math.sin(q*Math.PI*2))*(1-q)*8;a=1-q*q;}
  drawSheet('chip_'+c.col,c.t>c.life?0:Math.floor(c.fr)%12,x,yy,c.sc*(1+0.25*Math.sin(Math.PI*p)),a);}}
// big-combo light streaks (radial burst over the whole screen, very short)
function drawRays(){if(!S||!S.rays||SET.reduceFlash)return;const r=S.rays,p=r.t/r.life,a=(p<0.15?p/0.15:1-(p-0.15)/0.85)*0.3;VIEW.rays=+a.toFixed(3);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(r.x,r.y);ctx.rotate(p*0.25);
  const g=ctx.createRadialGradient(0,0,20,0,0,900);g.addColorStop(0,'rgba(255,250,230,'+a+')');g.addColorStop(0.5,'rgba(255,220,160,'+a*0.35+')');g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;
  ctx.beginPath();for(let i=0;i<28;i++){const a0=i/28*Math.PI*2,da=Math.PI/28*(i%2?0.35:0.7);ctx.moveTo(0,0);ctx.arc(0,0,900,a0,a0+da);ctx.closePath();}ctx.fill();ctx.restore();}
function softRays(x,y,a){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(x,y);ctx.rotate(SET.reduceFlash?0:T*0.12);
  const g=ctx.createRadialGradient(0,0,10,0,0,620);g.addColorStop(0,'rgba(255,220,150,'+0.16*a+')');g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;
  ctx.beginPath();for(let i=0;i<18;i++){const a0=i/18*Math.PI*2;ctx.moveTo(0,0);ctx.arc(0,0,620,a0,a0+Math.PI/30);ctx.closePath();}ctx.fill();ctx.restore();}
// lighting: the environment falls off into warm darkness around a pool of light on the well

function buildLight(){const k=Math.min(2,Math.max(1,DPR));const mk=()=>{const c=document.createElement('canvas');c.width=W*k;c.height=H*k;const x=c.getContext('2d');x.scale(k,k);return [c,x];};

  const [vc,vx]=mk();vx.save();vx.translate(640,360);vx.scale(1.32,1);g=vx.createRadialGradient(0,0,0,0,0,560);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,'rgba(0,0,0,0)');g.addColorStop(0.78,'rgba(0,0,0,0.42)');g.addColorStop(1,'rgba(0,0,0,0.88)');
  vx.fillStyle=g;vx.fillRect(-640,-360,1280,720);vx.restore();
  const [rc,rx]=mk();rx.save();rx.translate(640,360);rx.scale(1.32,1);g=rx.createRadialGradient(0,0,0,0,0,560);g.addColorStop(0,'rgba(150,0,8,0)');g.addColorStop(0.6,'rgba(150,0,8,0)');g.addColorStop(0.85,'rgba(150,0,12,0.45)');g.addColorStop(1,'rgba(120,0,10,0.9)');

  LIGHT={k,grade:gc,vig:vc,red:rc};}
function dangerEdges(){if(!S||!S.inDanger||app==='gameover')return;if(!LIGHT)buildLight();const a=SET.reduceFlash?0.5:0.4+0.3*(0.5+0.5*Math.sin(T*Math.PI*2*0.9));VIEW.dangerEdge=SET.reduceFlash?'static':'anim';
  ctx.save();ctx.globalAlpha=a;ctx.drawImage(LIGHT.red,0,0,W,H);ctx.restore();}

// v3 sparks: comet (rotated along velocity, anchor 0.85 = head), birth flash for 0.08 s, then a non-rotated twinkling glint
function drawSparks(){
  const A=META.sparks.anchor,SZ=META.sparks.size,GA=META.sparks.glint_anchor,GS=META.sparks.glint_size;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of S.sparks){const t=s.age/s.life;const a=clamp(s.age<0.15?1:Math.pow(1-t,1.4),0,1);
    const im=img('comet_'+s.col);if(!im)continue;const sp=Math.hypot(s.vx,s.vy)/FXS;const hot=s.age<0.08&&!SET.reduceFlash?1.35:1;if(hot>1)VIEW.birthFlash++;
    const sx=clamp(0.45+sp/650,0.5,1.8)*s.sz*FXS*hot,sy=s.sz*FXS*hot;
    ctx.globalAlpha=a;camT();ctx.translate(s.x+shx,s.y+shy);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.scale(sx,sy);
    ctx.drawImage(im,-A[0]*SZ[0],-A[1]*SZ[1],SZ[0],SZ[1]);
    if(hot>1){const wi=img('comet_white');if(wi){ctx.globalAlpha=a*0.6;ctx.drawImage(wi,-A[0]*SZ[0],-A[1]*SZ[1],SZ[0],SZ[1]);}}}
  for(const s of S.sparks){if(!(s.glint||s.age<0.1))continue;const gi=img('glint_'+s.col);if(!gi)continue;
    const t=s.age/s.life;const a=clamp(s.age<0.15?1:Math.pow(1-t,1.4),0,1);const k=s.sz*FXS*(SET.reduceFlash?0.8:0.55+0.6*Math.abs(Math.sin(s.age*22+s.seed)));
    ctx.globalAlpha=a;camT();ctx.translate(s.x+shx,s.y+shy);ctx.scale(k,k);
    ctx.drawImage(gi,-GA[0]*GS[0],-GA[1]*GS[1],GS[0],GS[1]);}
  ctx.restore();
}
// reduce flashing: additive clear FX are drawn much fainter (pops/fireballs 25 %, pillars and beams 20 %), no lightning,
// and the fireball skips its white-hot frames 0-2 (starts on frame 3)
function rfMul(sheet){if(!SET.reduceFlash)return 1;return (sheet.startsWith('pop')||sheet==='fireball')?0.25:(sheet.startsWith('pillar')||sheet.startsWith('beam'))?0.2:1;}
function plaque(){const q=META.plaque;if(!q||!S)return;ctx.save();ctx.font='bold 12px '+FONT_UI;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,230,170,0.35)';ctx.fillText('LEVEL '+S.level,q.x+q.w/2,q.y+q.h/2+1.5);ctx.fillStyle='#3a2a18';ctx.fillText('LEVEL '+S.level,q.x+q.w/2,q.y+q.h/2+0.5);ctx.restore();}
function drawFxList(filter){
  for(const f0 of S.fx){if(f0.delay>0||!filter(f0))continue;if(f0.sheet==='bolt'&&SET.reduceFlash)continue;const mul=rfMul(f0.sheet);const f=mul===1?f0:Object.assign({},f0,{alpha:(f0.alpha==null?1:f0.alpha)*mul});
    const m=META[f.sheet];let i=Math.floor(f.t*(m.fps||30));
    if(f.sheet==='fireball'){if(SET.reduceFlash)i=Math.max(i,3);VIEW.glowA=Math.max(VIEW.glowA,f.alpha==null?1:f.alpha);}
    if(f.sheet.startsWith('pop')||f.sheet==='fireball')VIEW.popAlpha=f.alpha==null?1:f.alpha;
    if(f.sheet==='bolt')VIEW.bolts++;
    if(f.sy){ctx.save();ctx.translate(f.x,f.y);ctx.scale(1,f.sy);drawSheet(f.sheet,i,0,0,1,f.alpha,f.blend);ctx.restore();}
    else if(f.rot){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);drawSheet(f.sheet,i,0,0,1,f.alpha,f.blend);ctx.restore();}
    else drawSheet(f.sheet,i,f.x,f.y,f.s||1,f.alpha,f.blend);}
}

let shx=0,shy=0;
function drawBoard(){
  const g=S.grid,dead=app==='gameover';
  drawLayer('well_floor');
  ctx.save();ctx.beginPath();ctx.rect(BX,BY,BW,BH);ctx.clip();
  // contact shadows: every card sits in its own soft dark pocket (one batched path)
  if(!dead){ctx.save();ctx.fillStyle='rgba(0,0,0,0.34)';ctx.beginPath();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(!k||(k.st==='clear'&&k.popped))continue;const x=BX+c*CW,y=BY+(r-S.rise+k.offY)*CH;rrPath(ctx,x+2,y+4,CW-2,CH-2,7);}
    if(S.preview)for(let c=0;c<COLS;c++)rrPath(ctx,BX+c*CW+2,BY+(ROWS-S.rise)*CH+4,CW-2,CH-2,7);
    ctx.fill();ctx.restore();}
  const moving=[],flashes=[],clearing=[],landing=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const k=g[r][c];if(!k)continue;
    const x=BX+c*CW,y=BY+(r-S.rise+k.offY)*CH;
    if(dead){const d=clamp(S.overT*1.6-(ROWS-r)*0.06,0,1);drawTile(cardName(k)+'_dim',x,y+d*d*30,1-d*0.5);continue;}
    if(k.st==='clear'){if(k.popped)continue;clearing.push([k,x,y]);if(k.t<FLASH)flashes.push([k,x,y]);continue;}
    if(k.swapT>0){moving.push([k,x,y]);continue;}
    if(k.landT>0){landing.push([k,x,y]);continue;}
    drawTile(cardName(k),x,y);
  }
  // swap: 80ms ease-out slide with an additive gold smear behind each tile
  // landing: quick squash around the bottom edge, then settle (a tiny bump, like a block hitting felt)
  for(const [k,x,y] of landing){const p=1-k.landT/LAND_T,a=Math.sin(Math.PI*Math.min(1,p*1.25))*(1-p*0.5);const sy=1-0.09*a,sx=1+0.06*a;
    ctx.save();ctx.translate(x+CW/2,y+CH);ctx.scale(sx,sy);drawTile(cardName(k),-CW/2,-CH);ctx.restore();}
  // swap: ease-out slide, the moving cards lift slightly (scale up mid-way)
  for(const [k,x,y] of moving){const p=1-k.swapT/SWAP_T,l=1+0.07*Math.sin(Math.PI*p);const xx=x+k.swapFrom*CW*(1-easeOutQuad(p));
    ctx.save();ctx.translate(xx+CW/2,y+CH/2);ctx.scale(l,l);drawTile(cardName(k),-CW/2,-CH/2);ctx.restore();}
  // v3: matched tiles squash/stretch around their centre by the flash scale_curve (hold the last frame until the pop)
  const SC=META.scale_curve;
  for(const [k,x,y] of clearing){
    if(SET.reduceFlash){// gentle, non-strobing: the tile eases towards its lighter variant over the flash time, no scaling
      const u=Math.min(1,k.t/FLASH);drawTile(cardName(k),x,y,1-0.35*u);drawTile(cardName(k)+'_flash',x,y,0.35*u);if(k.bomb)drawImg('bomb_lit',x,y,TS,TS);continue;}
    const q=SC[Math.min(SC.length-1,Math.floor(k.t/F))];VIEW.maxTileScale=Math.max(VIEW.maxTileScale,q[0],q[1]);
    ctx.save();ctx.translate(x+CW/2,y+CH/2);ctx.scale(q[0],q[1]);drawTile(cardName(k)+'_flash',-CW/2,-CH/2);if(k.bomb)drawImg('bomb_lit',-CW/2,-CH/2,TS,TS);ctx.restore();}
  // incoming row (dimmed), clipped at the well bottom
  if(S.preview&&!dead){for(let c=0;c<COLS;c++)drawTile(cardName(S.preview[c])+'_dim',BX+c*CW,BY+(ROWS-S.rise)*CH);}   // v4 _dim is a flat 35 %
  // matched cards: hot orange rim until they burst (steady, not strobing)
  if(!dead&&clearing.length){ctx.save();ctx.lineWidth=3;ctx.strokeStyle='#ffc23a';ctx.shadowColor='rgba(255,130,20,0.95)';ctx.shadowBlur=14;
    for(const [k,x,y] of clearing){rr(ctx,x+2.5,y+2.5,CW-5,CH-5,8);ctx.stroke();}ctx.restore();VIEW.outlines=clearing.length;}
  ctx.restore();
  if(!dead){
    const sm=img('smear');
    if(sm){ctx.save();ctx.globalCompositeOperation='lighter';
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=g[r][c];if(!k||!(k.smearT>0)||!k.swapFrom)continue;
        const p=k.swapT>0?1-k.swapT/SWAP_T:1;const x=BX+c*CW+k.swapFrom*CW*(1-easeOutQuad(p))+CW/2,y=BY+(r-S.rise+k.offY)*CH+CH/2;
        const dir=-Math.sign(k.swapFrom),w=sm.naturalWidth*FXS,h=sm.naturalHeight*FXS,ax=META.smear.anchor[0]*w;
        ctx.globalAlpha=0.9*k.smearT/SMEAR_T;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.drawImage(sm,-ax,-h/2,w,h);ctx.restore();}
      ctx.restore();}
    if(!SET.reduceFlash)for(const [k,x,y] of flashes){drawSheet('flash_'+k.fxKey,Math.floor(k.t/F),x+CW/2,y+CH/2,1,1,'lighter');VIEW.flashOverlays++;}
    drawFxList(f=>f.sheet.startsWith('puff'));
    if(S.inDanger){const m=META.pulse;
      if(SET.reduceFlash){drawSheet('pulse',3,BX,BY,1,0.6);VIEW.pulse='static';}   // one steady frame, no glow flicker
      else{const fi=Math.floor(T*15)%m.n;drawSheet('pulse',fi,BX,BY);drawSheet('pulse_glow',fi,BX,BY,1,1,'lighter');VIEW.pulse='anim';VIEW.pulseGlow=true;}}
    if(S.slowing){ctx.save();ctx.fillStyle='rgba(90,170,255,0.13)';ctx.fillRect(BX,BY,BW,BH);ctx.restore();}
  }
  drawLayer('well_rails');plaque();
  if(dead)return;
  if(S.inDanger){if(SET.reduceFlash){drawSheet('laser',0,BX+BW/2,BY,1,0.6,'lighter');VIEW.laser='static';}else{drawSheet('laser',Math.floor(T*15)%META.laser.n,BX+BW/2,BY,1,1,'lighter');VIEW.laser='anim';}}
  // v4 order: smoke (normal) under the fireballs and bolts (additive); gold beam/pillar/pop for a royal flush; then the well flash
  drawFxList(f=>f.sheet.startsWith('smoke'));
  drawFxList(f=>f.sheet.startsWith('beam'));
  drawFxList(f=>f.sheet.startsWith('pillar'));
  drawFxList(f=>f.sheet==='fireball'||f.sheet.startsWith('pop'));
  drawFxList(f=>f.sheet==='bolt');
  if(S.wellFlash>=0&&S.wellFlash<2*F&&!SET.reduceFlash){VIEW.wellFlashA=S.wellFlash<F?0.28:0.10;ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,'+(S.wellFlash<F?0.28:0.10)+')';ctx.fillRect(BX,BY,BW,BH);ctx.restore();}
}
function drawCursor(){

function drawPopups(){

      drawText(36,p.text,x,p.y-50*easeOutQuad(q),'center',t<0.1?1.45-0.45*(t/0.1):1,Math.max(0,a));}
    else{const a=t>p.life*0.75?1-(t-p.life*0.75)/(p.life*0.25):1;const s=t<0.12?0.5+0.5*easeOutBack(t/0.12):1;
      ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(p.x,p.y-t*14);ctx.scale(s,s);bigText(p.text,0,0,p.size,goldGrad(0,p.size),'#3a1a00',Math.max(4,p.size/5),520);ctx.restore();}

function bannerImg(key){if(key.startsWith('text:'))return makeBanner(key.slice(5),60);return img('banner_'+key);}
function drawBannerAt(key,x,y,s,a,num){
  const im=bannerImg(key);if(!im)return;const w=im.dw||im.naturalWidth,h=im.dh||im.naturalHeight;
  ctx.save();ctx.globalAlpha*=clamp(a,0,1);ctx.translate(x,y);ctx.scale(s,s);ctx.drawImage(im,-w/2,-h/2,w,h);
  if(num)drawText(48,num,w/2+8,4,'left',1);
  ctx.restore();}
function drawBanners(){
  const E=8*F;
  for(const b of S.banners){if(b.delay>0)continue;const t=b.t;let s=1,a=1,dy=0;
    if(t<E)s=0.4+0.6*easeOutBack(t/E);
    if(!b.hold&&t>b.life-E){const q=(t-(b.life-E))/E;dy=-20*q;a=1-q;}
    if(b.scale>=0.9&&b.key!=='ready'&&b.key!=='go'){const eb=img('event_band');const bw=Math.round(W*easeOutQuad(clamp(t/0.16,0,1))),bh=96*b.scale;
      if(eb&&bw>0){ctx.save();ctx.globalAlpha=a;const ew=eb.naturalWidth;for(let x0=640-bw/2;x0<640+bw/2;x0+=ew){const w0=Math.min(ew,640+bw/2-x0);ctx.drawImage(eb,0,0,w0,eb.naturalHeight,x0,b.y+dy-bh/2,w0,bh);}ctx.restore();}}
    drawBannerAt(b.key,b.x,b.y+dy,s*b.scale,a,b.num);}
}

function button(x,y,w,h,text,sel,action,sub,slide){

// ---------- settings screen ----------
let setOpen=false,setFrom='title',setSel=1,setDrag=null,pauseSel=0;
const SET_ROWS=['fullscreen','flash','sfx','music','back'];
const FS_EL=document.documentElement;
const fsLast={calls:0,result:null};
function fsAvailable(){return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(FS_EL.requestFullscreen||FS_EL.webkitRequestFullscreen);}
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFs(){try{
  if(isFs()){const f=document.exitFullscreen||document.webkitExitFullscreen;const r=f&&f.call(document);if(r&&r.catch)r.catch(()=>{});return;}
  const f=FS_EL.requestFullscreen||FS_EL.webkitRequestFullscreen;if(!f)return;fsLast.calls++;fsLast.result='pending';
  const r=f.call(FS_EL);if(r&&r.then)r.then(()=>{fsLast.result='ok';},er=>{fsLast.result='rejected: '+(er&&er.name||er);});else fsLast.result='called';
}catch(er){fsLast.result='threw: '+(er&&er.name||er);}}
for(const ev of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>{resize();canvas.focus();});
function setRows(){return SET_ROWS.filter(r=>r!=='fullscreen'||fsAvailable());}
function openSettings(from){setOpen=true;setFrom=from;setSel=SET_ROWS.indexOf(setRows()[0]);setDrag=null;}
function closeSettings(){setOpen=false;setDrag=null;if(setFrom==='paused'&&app==='paused')pauseSel=1;}
function setVol(row,v){v=clamp(Math.round(v/10)*10,0,100);if(v===SET[row])return;SET[row]=v;applyVolumes();saveSettings();if(row==='sfx')sfx.preview();}
function setActivate(row,d){
  if(row==='fullscreen'){if(fsAvailable())toggleFs();}
  else if(row==='flash'){SET.reduceFlash=!SET.reduceFlash;saveSettings();}
  else if(row==='sfx'||row==='music'){if(d)setVol(row,SET[row]+d*10);}
  else if(row==='back')closeSettings();}
function settingsKey(e,k,code){
  const rows=setRows();let i=Math.max(0,rows.indexOf(SET_ROWS[setSel]));const row=rows[i];
  if(k==='ArrowUp'||k==='ArrowDown'){i=(i+(k==='ArrowUp'?rows.length-1:1))%rows.length;setSel=SET_ROWS.indexOf(rows[i]);sfx.move();}
  else if(k==='ArrowLeft'||k==='ArrowRight'){if(row==='sfx'||row==='music')setActivate(row,k==='ArrowLeft'?-1:1);else if(row!=='back'&&!e.repeat){setActivate(row,0);sfx.click();}}
  else if(k==='Enter'||k===' '||code==='KeyZ'){if(!e.repeat){if(row==='sfx'||row==='music')return;setActivate(row,0);sfx.click();}}
  else if(k==='Escape'||code==='KeyB'||k==='Backspace'){closeSettings();sfx.click();}
}
function pauseAction(i){sfx.click();if(i===0)app='playing';else if(i===1)openSettings('paused');else app='title';}
function drawToggle(x,y,on,disabled){const w=92,h=36;ctx.save();
  rr(ctx,x,y,w,h,h/2);ctx.fillStyle=disabled?'rgba(70,60,50,0.7)':on?'#e8a21c':'rgba(20,12,4,0.9)';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=disabled?'rgba(150,140,120,0.6)':'rgba(255,215,110,0.95)';ctx.stroke();
  if(on&&!disabled){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(255,250,200,0.55)');g.addColorStop(1,'rgba(255,140,0,0)');rr(ctx,x+2,y+2,w-4,h/2,h/4);ctx.fillStyle=g;ctx.fill();}
  const kx=on?x+w-h/2:x+h/2;ctx.beginPath();ctx.arc(kx,y+h/2,h/2-4,0,Math.PI*2);ctx.fillStyle=disabled?'#8a8070':'#fff4dc';ctx.fill();ctx.strokeStyle='#3a1a00';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  label(disabled?'N/A':on?'ON':'OFF',on?x+26:x+w-26,y+h/2+7,17,disabled?'#b8b0a0':on?'#3a1a00':'#ffe7a0','center');}
function drawSlider(x,y,w,v){ctx.save();
  rr(ctx,x,y-7,w,14,7);ctx.fillStyle='rgba(20,12,4,0.9)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,215,110,0.8)';ctx.stroke();
  if(v>0){rr(ctx,x+2,y-5,Math.max(10,(w-4)*v/100),10,5);const g=ctx.createLinearGradient(0,y-5,0,y+5);g.addColorStop(0,'#fff0a0');g.addColorStop(1,'#ff9a10');ctx.fillStyle=g;ctx.fill();}
  for(let i=0;i<=10;i++){ctx.fillStyle='rgba(255,230,160,0.5)';ctx.fillRect(Math.round(x+w*i/10)-1,y+11,2,i%5?4:7);}
  const kx=x+w*v/100;ctx.beginPath();ctx.arc(kx,y,12,0,Math.PI*2);ctx.fillStyle='#fff4dc';ctx.fill();ctx.strokeStyle='#3a1a00';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(kx,y,5,0,Math.PI*2);ctx.fillStyle='#e8a21c';ctx.fill();ctx.restore();}
function drawSettings(){
  buttons=[];
  const px=390,py=112,pw=500,ph=500;solidPanel(px,py,pw,ph);
  bigText('SETTINGS',640,py+50,40,goldGrad(py+50,40),'#3a1a00',7);
  const fsOk=fsAvailable();
  const rows=[
    ['fullscreen','Full screen',fsOk?(isFs()?'Esc or F11 also exits':'Fill the whole screen'):'Not available on this device'],
    ['flash','Reduce flashing',SET.reduceFlash?'Soft clears · no shake, strobes or white flashes':'Full clear flashes, shake and danger pulse'],
    ['sfx','Sound effects',''],['music','Music','']];
  rows.forEach(([id,name,sub],i)=>{const cy=py+120+i*74,idx=SET_ROWS.indexOf(id),sel=setSel===idx,dis=id==='fullscreen'&&!fsOk;
    if(sel&&!dis){ctx.save();rr(ctx,px+18,cy-32,pw-36,64,12);ctx.fillStyle='rgba(255,200,60,0.12)';ctx.fill();ctx.strokeStyle='rgba(255,210,80,0.9)';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();}
    shadowLabel(name,px+42,cy+(sub?-2:7),22,dis?'#a89a80':sel?'#ffe7a0':'#fff4dc');
    if(sub)label(sub,px+42,cy+20,13,dis?'#8a7e68':'#d8c8a8');
    if(id==='fullscreen'||id==='flash'){const on=id==='flash'?SET.reduceFlash:isFs();drawToggle(px+pw-134,cy-18,on,dis);
      if(!dis)buttons.push({id:'set_'+id,x:px+18,y:cy-32,w:pw-36,h:64,action:()=>{setSel=idx;setActivate(id,0);}});}
    else{const tx=px+214,tw=160;drawSlider(tx,cy,tw,SET[id]);shadowLabel(SET[id]+'%',px+pw-40,cy+8,20,'#ffffff','right');
      buttons.push({id:'set_'+id,x:tx-16,y:cy-30,w:tw+32,h:60,action:()=>{},drag:p=>{setSel=idx;setVol(id,(p.x-tx)/tw*100);}});}
  });
  const by=py+ph-106;button(540,by,200,54,'BACK',setSel===SET_ROWS.indexOf('back'),()=>{closeSettings();});buttons[buttons.length-1].id='set_back';
  label('↑↓ select  ·  ←→ adjust  ·  Enter / Space toggle  ·  Esc / B back',640,py+ph-22,14,'#cdbb98','center');

function drawGear(x,y,s){ctx.save();rr(ctx,x+2,y+2,s-4,s-4,10);ctx.fillStyle='rgba(22,14,6,0.8)';ctx.fill();ctx.restore();nine('panel_9slice',x,y,s,s,12);
  const cx=x+s/2,cy=y+s/2,R=s*0.3,r=s*0.21,n=8;ctx.save();ctx.beginPath();
  for(let i=0;i<n*2;i++){const a0=(i/(n*2))*Math.PI*2,a1=((i+1)/(n*2))*Math.PI*2,rad=i%2?r:R;ctx.arc(cx,cy,rad,a0,a1);}
  ctx.closePath();ctx.moveTo(cx+s*0.1,cy);ctx.arc(cx,cy,s*0.1,0,Math.PI*2,true);
  ctx.fillStyle=goldGrad(cy,s*0.6);ctx.fill('evenodd');ctx.strokeStyle='#3a1a00';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
// frame stats for the test hook (what the renderer actually drew)
const VIEW={};
function render(){
  buttons=[];
  VIEW.wellFlashA=0;VIEW.shakeAmp=0;VIEW.flashOverlays=0;VIEW.maxTileScale=1;VIEW.pulse='off';VIEW.pulseGlow=false;VIEW.laser='off';VIEW.birthFlash=0;VIEW.popAlpha=null;VIEW.bolts=0;VIEW.rays=0;VIEW.punch=CAM.p||0;VIEW.dangerEdge='off';VIEW.chainTexts=0;VIEW.glowA=0;VIEW.outlines=0;VIEW.multGlow=false;VIEW.vignette=false;

  if(app==='title'||!S){drawTitle();if(setOpen){dim(0.66);drawSettings();}return;}
  camT();
  drawEnvBack();
  // shake group: 9 frames, amplitude decaying linearly, offset (A sin 2.7f, A cos 3.9f)
  shx=shy=0;
  if(S.shakeT>0&&!SET.reduceFlash){const f=frameNo,A=S.shakeAmp*(S.shakeT/SHAKE_T);VIEW.shakeAmp=A;shx=Math.round(A*Math.sin(2.7*f));shy=Math.round(A*Math.cos(3.9*f));}

  drawHUD();

// ---------- loop ----------
let last=performance.now();
let frozen=false;
function frame(now){if(app!=='paused'){pauseSel=0;if(setOpen&&setFrom==='paused')setOpen=false;}if(setOpen&&setFrom==='title'&&app!=='title')setOpen=false;const dt=frozen?0:Math.min(0.05,Math.max(0,(now-last)/1000));last=now;feelFrame(dt);update(dt);try{musicTick();}catch(e){}render();renderTop();requestAnimationFrame(frame);}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&app==='playing')app='paused';});
resize();canvas.focus();loadAssets();requestAnimationFrame(frame);

// ---------- test hook ----------
const cardStr=k=>k?RANKS[k.r]+SUITS[k.s]:null;
function parseCard(s){if(!s)return null;const k=newCard();k.r=RANKS.indexOf(s.slice(0,-1));k.s=SUITS.indexOf(s.slice(-1));return k;}
window.__royalRush={
  get ready(){return assetsReady;},
  get state(){return app;},
  get score(){return S?S.score:0;},
  get grid(){return S?S.grid.map(row=>row.map(cardStr)):null;},
  get cells(){return S?S.grid.map(row=>row.map(k=>k?{card:cardStr(k),st:k.st,swapping:k.swapT>0,chain:k.chain}:null)):null;},
  get preview(){return S&&S.preview?S.preview.map(cardStr):null;},
  get cursor(){return S?{r:S.cursor.r,c:S.cursor.c}:null;},
  get rise(){return S?S.rise:0;},
  get level(){return S?S.level:0;},
  get chain(){return S?S.chain:0;},
  get maxChain(){return S?S.maxChain:0;},
  get hands(){return S?S.hands:0;},
  get best(){return S?S.best:loadBest('action');},
  get mode(){return S?S.mode:null;},
  get shifts(){return S?S.shifts:0;},
  get stop(){return S?S.stop:0;},
  get intro(){return S?Math.max(0,S.intro):0;},
  get popups(){return S?S.banners.map(b=>b.tag||'banner_'+b.key).concat(S.popups.map(p=>p.text)).concat(S.chainTexts.map(c=>'chain_x'+c.n)):[];},
  get danger(){return S?S.inDanger:false;},
  get clearAge(){return S?S.clearAge:-1;},
  get fx(){return S?{sparks:S.sparks.length,glints:S.sparks.filter(s=>s.glint).length,chips:S.chipsFx.length+S.toss.length,toss:S.toss.length,bolts:S.fx.filter(f=>f.sheet==='bolt').length,fireballs:S.fx.filter(f=>f.sheet==='fireball').length,smoke:S.fx.filter(f=>f.sheet.startsWith('smoke')).length,chainTexts:S.chainTexts.map(c=>c.n),rays:!!S.rays,glows:S.glows.length,fx:S.fx.map(f=>f.sheet+(f.alpha!=null?'@'+f.alpha:'')),shake:S.shakeT,shakeAmp:S.shakeAmp,wellFlash:S.wellFlash}:null;},
  start(mode){newGame(mode||'action');},
  setGrid(rows){if(!S)newGame('action');S.grid=rows.map(r=>r.map(parseCard));S.rise=0;S.clearAge=-1;},
  setSpeedMultiplier(m){speedMul=m;},
  setCursor(r,c){if(S)S.cursor={r,c};},
  set freeze(v){frozen=!!v;},
  get freeze(){return frozen;},

  genRowFor(strGrid){const g=strGrid.map(r=>r.map(x=>x?parseCard(x):null));return genRow(g).map(cardStr);},
  handsIn(strGrid){const g=strGrid.map(r=>r.map(s=>s?parseCard(s):null));return findHands(g,()=>true).map(h=>({name:h.name,value:h.value,cells:h.cells}));},
  get audio(){const T=MUS.tracks;return {ctx:AC?AC.state:'none',sampleRate:AC?AC.sampleRate:0,muted,master:MASTER?MASTER.gain.value:null,
    decoded:Object.keys(BUF).sort(),durations:Object.fromEntries(Object.entries(BUF).map(([k,b])=>[k,+b.duration.toFixed(3)])),lengths:Object.fromEntries(Object.entries(BUF).map(([k,b])=>[k,b.length])),
    decodeErrors:DECODE_ERR.slice(),decodeDone,want:MUS.want,
    playing:Object.values(T).map(t=>({n:t.n,loop:t.src.loop,loopEnd:+t.src.loopEnd.toFixed(3),gain:+t.gain.gain.value.toFixed(3)})),
    voices:VOICES.length,musicBus:MUSIC_BUS?+MUSIC_BUS.gain.value.toFixed(3):null,sfxGain:SFX_BUS?+SFX_BUS.gain.value.toFixed(3):null,musicGain:MUSIC_GAIN?+MUSIC_GAIN.gain.value.toFixed(3):null,log:AUD_LOG.slice()};},
  audioLogClear(){AUD_LOG.length=0;},
  testChainFx(n){if(!S)return false;const p=cellCenter(8,2);chainFx(p.x,p.y,n||2);punch(0.03);S.rays={t:0,life:0.6,x:p.x,y:p.y};
    addFx('bolt',p.x,p.y,{alpha:0.9,blend:'lighter',board:true,sy:(p.y+10)/720});addFx('smoke_a',p.x,p.y,{board:true,delay:4*F});addFx('fireball',p.x,p.y,{alpha:1,blend:'lighter',board:true,delay:F});return true;},

  get buttons(){return buttons.map(b=>({id:b.id,x:b.x,y:b.y,w:b.w,h:b.h}));},

  constants:{COLS,ROWS,CW,CH,BX,BY,W,H}
};
